<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ساعت">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ساعت چهارتکه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--mute:#6b6b70;--sec:#d13b2e;--tile:#fffdf8;--tick:#9a9a9f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--fg:#ececef;--mute:#98989f;--sec:#ff6a5c;--tile:#1d1d21;--tick:#5d5d64}}
:root[data-theme="dark"]{--bg:#141416;--fg:#ececef;--mute:#98989f;--sec:#ff6a5c;--tile:#1d1d21;--tick:#5d5d64}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px}
svg{width:min(96vw,92vh,720px);height:auto;max-width:100%;display:block}
.frame{fill:var(--tile);stroke:var(--fg);stroke-width:5}
.arc{fill:none;stroke:var(--fg);stroke-width:2.5}
.tk{stroke:var(--tick);stroke-width:1.5}
.lbl{font-size:15px;fill:var(--mute);text-anchor:middle;dominant-baseline:central}
.hand{stroke-linecap:round}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
svg{direction:ltr;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.pn{fill:var(--bg);stroke:var(--fg);stroke-width:3}
.pt{font-size:36px;font-weight:700;fill:var(--fg);text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.ps{font-size:20px;font-weight:700;fill:var(--sec);text-anchor:middle;dominant-baseline:central}
.bar{fill:var(--tick);opacity:.35}.barf{fill:var(--sec)}
.tip{stroke:var(--tile);stroke-width:2}
</style>
</head>
<body>
<svg viewBox="0 0 400 400" id="svg" role="img" aria-label="ساعت">
  <g id="tile"></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg",PX=33,PY=367;
const R={s:322,m:235,h:148};
const fa=n=>Number(n).toLocaleString("fa-IR",{useGrouping:false});
const tile=document.getElementById("tile");
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||tile).appendChild(e);return e}
const pt=(r,t)=>[PX+r*Math.sin(t*Math.PI/180),PY-r*Math.cos(t*Math.PI/180)];
el("rect",{x:6,y:6,width:388,height:388,rx:44,class:"frame"});
const labelG=el("g",{}),tickG=el("g",{});
for(const k in R){const r=R[k];el("path",{d:`M ${PX} ${PY-r} A ${r} ${r} 0 0 1 ${PX+r} ${PY}`,class:"arc"})}
const hands={
 h:el("line",{class:"hand",stroke:"var(--mute)","stroke-width":6}),
 m:el("line",{class:"hand",stroke:"var(--fg)","stroke-width":4}),
 s:el("line",{class:"hand",stroke:"var(--sec)","stroke-width":2.5})};
const tips={s:el("circle",{r:6,fill:"var(--sec)",class:"tip"}),m:el("circle",{r:6,fill:"var(--fg)",class:"tip"}),h:el("circle",{r:7,fill:"var(--mute)",class:"tip"})};
el("circle",{cx:PX,cy:PY,r:10,fill:"var(--tile)",stroke:"var(--fg)","stroke-width":3.5});
el("circle",{cx:PX,cy:PY,r:3.5,fill:"var(--sec)"});

// tick geometry: s,m = 15 units per quarter; h = 6 units
const cfg={s:{n:15,step:5},m:{n:15,step:5},h:{n:6,step:1}};
const texts={};
for(const k in cfg){
  const {n,step}=cfg[k],r=R[k];
  for(let i=0;i<=n;i++){const t=90*i/n,len=(i%step===0)?10:5;
    const a=pt(r,t),b=pt(r-len,t);
    el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:"tk"},tickG)}
  texts[k]=[];
  for(let i=0;i<=n;i+=step){const t=90*i/n,p=pt(r+15,t);
    texts[k].push({i,x:p[0],y:p[1],e:el("text",{class:"lbl",x:p[0],y:p[1]},labelG)})}
}
const sets={s:60,m:60,h:24};
function setLabels(k,q){
  const per=k==="h"?6:15;
  texts[k].forEach(o=>{let v=q*per+o.i;if(v>=sets[k]&&k!=="h")v-=sets[k];o.e.textContent=fa(v)});
}
const now=()=>new Date();
const qs={s:-1,m:-1,h:-1},disp={s:0,m:0,h:0};
let rot=null,n=0,lastQ=null;
const ease=(a,b,f)=>a+(b-a)*f;
function frame(){
  const d=now(),ms=d.getMilliseconds();
  const s=d.getSeconds()+ms/1000,m=d.getMinutes()+s/60,h=d.getHours()+m/60;
  const val={s,m,h},per={s:15,m:15,h:6};
  for(const k of ["s","m","h"]){
    const q=Math.floor(val[k]/per[k]),loc=(val[k]%per[k])/per[k]*90;
    if(q!==qs[k]){qs[k]=q;setLabels(k,q)}
    if(Math.abs(disp[k]-loc)>1.5)disp[k]=ease(disp[k],loc,.1);else disp[k]=loc;
    const p=pt(R[k],disp[k]),H=hands[k];
    H.setAttribute("x1",PX);H.setAttribute("y1",PY);H.setAttribute("x2",p[0]);H.setAttribute("y2",p[1]);
    tips[k].setAttribute("cx",p[0]);tips[k].setAttribute("cy",p[1]);
  }
  // page rotation
  const q=qs.h;
  if(rot===null){rot=90*q;n=q;lastQ=q}
  if(q!==lastQ){n+=(q-lastQ+4)%4;lastQ=q}
  rot=Math.abs(rot-90*n)>.05?ease(rot,90*n,.06):90*n;
  tile.setAttribute("transform",`rotate(${rot} 200 200)`);
  for(const k in texts)texts[k].forEach(o=>o.e.setAttribute("transform",`rotate(${-rot} ${o.x} ${o.y})`));
  requestAnimationFrame(frame);
}
frame();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
